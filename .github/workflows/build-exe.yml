name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install customtkinter pymupdf pillow pdf2docx pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all pdf2docx --collect-all docx --icon desktop/icon.ico --paths desktop --name PIXORA desktop/pixora.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIXORA
          path: dist/PIXORA.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PIXORA.exe
