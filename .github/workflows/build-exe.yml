name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install customtkinter pymupdf pillow pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --name PDF2JPEG-Studio desktop/pdf_to_jpeg.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2JPEG-Studio
          path: dist/PDF2JPEG-Studio.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF2JPEG-Studio.exe
